# Berkas tambahan Compose: memasang keystore penanda tangan HANYA ke layanan `signer` (secrets + label stempel; tidak ada kunci lain).
# Hanya dimuat Makefile (COMPOSE_FILE=docker-compose.yml:docker-compose.keystore.yml) bila KEDUA berkas ada (scripts/keystore.sh present).
# JANGAN dimuat tanpa kedua berkas itu: Compose akan gagal membuat kontainer signer. Lihat docs/deploy.md.
# Hardening signer (jaringan mati, read-only, user 10001, cap_drop, tmpfs, volume) ada di docker-compose.yml dan TIDAK boleh diubah di sini (dijaga tes).
# Label berubah bila inode/ukuran/mtime berkas kunci berubah (bind-mount mengunci inode) sehingga `up -d` membuat ulang signer; lihat Makefile (KEYSTORE_STAMP).
services:
  signer:
    secrets: [signing_keystore, signing_keystore_pass]
    labels:
      reverse-apk.keystore-stamp: "${KEYSTORE_STAMP:-}"
secrets:
  signing_keystore:      { file: ./secrets/signing_keystore.p12 }
  signing_keystore_pass: { file: ./secrets/signing_keystore_pass }
