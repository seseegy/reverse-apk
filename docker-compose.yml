name: reverse-apk

# Pengerasan umum untuk semua layanan.
x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ------------------------------------------------------------------ TLS + reverse proxy
  caddy:
    image: caddy:2.11-alpine
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?isi APP_DOMAIN di .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      ATTACH_MAX_MB: ${ATTACH_MAX_MB:-25}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m

  # ------------------------------------------------------------------ Aplikasi web
  web:
    build:
      context: ./services
      dockerfile: web/Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SECRET_KEY: ${SECRET_KEY:?jalankan `make init`}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      # --- Lampiran chat & berkas buatan AI (volume `files`)
      ATTACH_MAX_MB: ${ATTACH_MAX_MB:-25}
      FILES_QUOTA_MB: ${FILES_QUOTA_MB:-1024}
      FILES_MAX_COUNT: ${FILES_MAX_COUNT:-2000}
      MIN_FREE_GB: ${MIN_FREE_GB:-15}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-2700}
      # --- AI (M4). Kunci hanya masuk ke service web; tidak pernah ke browser, worker, atau runner.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_PRO: ${AI_MODEL_PRO:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_CREDIT_IDR: ${AI_CREDIT_IDR:-300}
      AI_DAILY_BUDGET_CREDITS: ${AI_DAILY_BUDGET_CREDITS:-5}
      AI_SESSION_BUDGET_CREDITS: ${AI_SESSION_BUDGET_CREDITS:-1}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-100}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_TOOL_CHARS: ${AI_MAX_TOOL_CHARS:-14000}
      AI_MAX_TURN_TOOL_CHARS: ${AI_MAX_TURN_TOOL_CHARS:-0}
      AI_TOOL_TIMEOUT: ${AI_TOOL_TIMEOUT:-60}
      AI_MAX_IMAGE_MB: ${AI_MAX_IMAGE_MB:-10}
      AI_INLINE_ATTACH_CHARS: ${AI_INLINE_ATTACH_CHARS:-16000}
      AI_REDACT_SECRETS: ${AI_REDACT_SECRETS:-1}
      AI_SHELL_ENABLED: ${AI_SHELL_ENABLED:-0}
      AI_SHELL_TIMEOUT: ${AI_SHELL_TIMEOUT:-60}
      AI_SHELL_MAX_TIMEOUT: ${AI_SHELL_MAX_TIMEOUT:-120}
      AI_SHELL_MAX_CALLS_PER_TURN: ${AI_SHELL_MAX_CALLS_PER_TURN:-40}
      AI_SHELL_MAX_OUTPUT_CHARS: ${AI_SHELL_MAX_OUTPUT_CHARS:-12000}
      AI_SHELL_SPOOL: /data/benchspool
      AI_SHELL_NET_ALLOW: ${AI_SHELL_NET_ALLOW:-}
      AI_SHELL_NET_PORTS: ${AI_SHELL_NET_PORTS:-443}
      AI_DAY_OFFSET_HOURS: ${AI_DAY_OFFSET_HOURS:-7}
      AI_MODELS_FILE: /config/ai_models.json
    secrets:
      - admin_password_hash
    volumes:
      - uploads:/data/uploads
      - work:/data/work
      - files:/data/files
      - db:/data/db
      - bench:/data/bench          # web hanya MENGHAPUS ruang kerja saat analisis dihapus; tidak pernah membaca isinya (data tak tepercaya)
      - benchspool:/data/benchspool
      - ./config:/config:ro
    networks: [edge, backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    pids_limit: 256

  # ------------------------------------------------------------------ Worker antrean
  # Hanya di jaringan `backend` (internal, tanpa akses internet). Akses ke DeepSeek
  # ditambahkan di M3 lewat jaringan terpisah. Alat dekompilasi TIDAK ada di sini:
  # worker menitipkan job ke `runner` lewat volume `spool` (tanpa Docker socket).
  worker:
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      DATA_DIR: /data
      TIMEOUT_APKTOOL: ${TIMEOUT_APKTOOL:-300}
      TIMEOUT_JADX: ${TIMEOUT_JADX:-900}
      TIMEOUT_ANALYZE: ${TIMEOUT_ANALYZE:-300}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-2700}
    volumes:
      - uploads:/data/uploads:ro
      - work:/data/work
      - db:/data/db
      - spool:/data/spool
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
      # web membuat/menyiapkan isi volume (izin & skema DB) lebih dulu.
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    pids_limit: 256

  # ------------------------------------------------------------------ Redis (antrean)
  redis:
    image: redis:8.8-alpine
    <<: *hardening
    # Jalankan langsung sebagai user `redis`: dengan cap_drop ALL, entrypoint tidak bisa
    # chown/setuid bila dimulai sebagai root.
    user: redis
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m

  # ------------------------------------------------------------------ Runner (jadx + apktool)
  # Satu-satunya tempat yang mem-parsing APK tak tepercaya. TANPA JARINGAN, tanpa Redis, tanpa DB, tanpa
  # Docker socket: hanya melihat APK (read-only), direktori kerja, dan spool job. Setelah tiap job, daemon
  # keluar dan Docker memulai container baru (RUNNER_RECYCLE) sehingga tiap job berjalan di lingkungan bersih.
  runner:
    build:
      context: ./services
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=256m,nosuid
    environment:
      DATA_DIR: /data
      RUNNER_RECYCLE: ${RUNNER_RECYCLE:-1}
      MAX_OUTPUT_MB: ${MAX_OUTPUT_MB:-3072}
    volumes:
      - uploads:/data/uploads:ro
      - work:/data/work
      - spool:/data/spool
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "runner-daemon", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    cpus: 2
    pids_limit: 512

  # Shell terisolasi untuk tool AI `shell_run` (PRD 09, Bagian C). DIMATIKAN dari sisi web secara bawaan (AI_SHELL_ENABLED=0); layanan ini tetap berjalan
  # tetapi hanya menunggu. TANPA JARINGAN dan TANPA RAHASIA: tidak ada kunci AI, DB, Redis, files, atau keystore. Memasang uploads (baca saja), work (BACA SAJA;
  # Landlock lebih jauh menutup work/<id>/index) dan volume khusus bench (ruang kerja) + benchspool (antrean dari web). Tiap perintah dikurung Landlock ke
  # satu analisis; bila Landlock tidak tersedia perintah DITOLAK (gagal tertutup). Uji: `make bench-selftest`.
  bench:
    build:
      context: ./services
      dockerfile: bench/Dockerfile
    restart: unless-stopped
    init: true
    # Jaringan: `benchnet` bertanda internal (tanpa gateway ke internet) dan hanya berisi bench + egress. Tanpa `edge`/`backend`: bench tidak bisa menjangkau web, Redis, atau Caddy.
    # Satu-satunya yang bisa dijangkau adalah proxy `egress` (port 3128), dan Landlock ABI >= 4 mengunci connect() TCP hanya ke port itu.
    networks: [benchnet]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=256m,nosuid
    environment:
      DATA_DIR: /data
      BENCH_SPOOL: /data/benchspool
      # SATU sakelar: `:+` mengisi egress:3128 HANYA bila AI_SHELL_NET_ALLOW terisi (kosong = bench tanpa jaringan, egress menolak semua), jadi dua sisi selalu sejalan.
      BENCH_NET_PROXY: ${AI_SHELL_NET_ALLOW:+egress:3128}
      BENCH_CMD_MAX_TIMEOUT: ${AI_SHELL_MAX_TIMEOUT:-120}
      BENCH_CMD_MAX_OUTPUT_KB: ${BENCH_CMD_MAX_OUTPUT_KB:-64}
      BENCH_WORKSPACE_MAX_MB: ${BENCH_WORKSPACE_MAX_MB:-2048}
      BENCH_FILE_MAX_MB: ${BENCH_FILE_MAX_MB:-256}
      BENCH_NPROC: ${BENCH_NPROC:-2048}
      BENCH_IDLE_EXIT: ${BENCH_IDLE_EXIT:-900}
    volumes:
      - uploads:/data/uploads:ro
      - work:/data/work:ro
      - bench:/data/bench
      - benchspool:/data/benchspool
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bench-daemon", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    cpus: 1
    pids_limit: 512

  # Proxy keluar untuk shell AI (jaringan untuk menguji API). Satu-satunya kontainer yang bisa dijangkau `bench` dan satu-satunya yang punya jalan ke internet. Hanya
  # CONNECT (HTTPS), daftar putih host (AI_SHELL_NET_ALLOW; kosong = SEMUA ditolak), alamat internal/privat/metadata cloud SELALU ditolak, batas koneksi/byte.
  # Tanpa volume, tanpa rahasia, tanpa `edge`/`backend`.
  egress:
    build:
      context: ./services
      dockerfile: egress/Dockerfile
    restart: unless-stopped
    init: true
    networks: [benchnet, egressnet]
    read_only: true
    user: "10003:10003"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      EGRESS_ALLOW: ${AI_SHELL_NET_ALLOW:-}
      EGRESS_PORTS: ${AI_SHELL_NET_PORTS:-443}
      EGRESS_MAX_CONNECTIONS: ${EGRESS_MAX_CONNECTIONS:-32}
      EGRESS_MAX_MB_PER_CONN: ${EGRESS_MAX_MB_PER_CONN:-100}
      EGRESS_MAX_MB_PER_HOUR: ${EGRESS_MAX_MB_PER_HOUR:-1024}
    healthcheck:
      test: ["CMD", "egress-proxy", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # Penanda tangan APK (PRD 09 Bagian B, paket B-1b: HANYA toolchain zipalign + apksigner). BELUM ada daemon, keystore, volume, maupun rahasia; satu-satunya isinya `signer-selftest`
  # (`make signer-selftest`). Profil `build`: TIDAK ikut `make up` / `docker compose up` sehingga RAM tidak bertambah sampai fitur build dipakai (`docker compose --profile build ...`).
  signer:
    build:
      context: ./services
      dockerfile: signer/Dockerfile
    profiles: ["build"]
    restart: "no"
    init: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=256m,nosuid
    mem_limit: 512m
    cpus: 1
    pids_limit: 128

networks:
  # Caddy <-> web. Berjaringan keluar (web akan memanggil DeepSeek untuk chat di M3).
  edge: {}
  # Web <-> worker <-> redis. `internal`: tidak ada rute ke internet.
  backend:
    internal: true
  # bench <-> egress SAJA. internal: tanpa rute ke internet; DNS Docker hanya me-resolve nama kontainer.
  benchnet:
    internal: true
  # Kaki keluar milik egress SAJA (bukan edge/backend): proxy sendiri tidak punya rute ke web/Redis/Caddy.
  egressnet: {}

volumes:
  uploads:   # APK asli (<sha256>.apk); web rw, worker & runner ro
  work:      # hasil per analisis (jadx/, apktool/, logs/, manifest.json)
  files:     # lampiran chat (up/) + berkas buatan AI (ai/) per analisis; HANYA web yang memasangnya, dan tidak ikut terhapus saat "Analisis ulang"
  db:        # SQLite (WAL); hanya web & worker — runner TIDAK punya akses
  spool:     # antrean berkas worker -> runner; hanya worker & runner
  bench:     # ruang kerja shell AI per analisis (bench/<id>/); web memasangnya untuk membersihkan, bench untuk bekerja
  benchspool: # antrean web -> bench (perintah shell AI); HANYA web & bench, terpisah dari spool worker/runner
  redisdata:
  caddy_data:
  caddy_config:

secrets:
  admin_password_hash:
    file: ./secrets/admin_password_hash
