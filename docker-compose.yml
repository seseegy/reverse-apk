name: reverse-apk

# Pengerasan umum untuk semua layanan.
x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ------------------------------------------------------------------ TLS + reverse proxy
  caddy:
    image: caddy:2.11-alpine
    <<: *hardening
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?isi APP_DOMAIN di .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 256m

  # ------------------------------------------------------------------ Aplikasi web
  web:
    build:
      context: ./services
      dockerfile: web/Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SECRET_KEY: ${SECRET_KEY:?jalankan `make init`}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MIN_FREE_GB: ${MIN_FREE_GB:-15}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-2700}
      # --- AI (M4). Kunci hanya masuk ke service web; tidak pernah ke browser, worker, atau runner.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_PRO: ${AI_MODEL_PRO:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_CREDIT_IDR: ${AI_CREDIT_IDR:-300}
      AI_DAILY_BUDGET_CREDITS: ${AI_DAILY_BUDGET_CREDITS:-5}
      AI_SESSION_BUDGET_CREDITS: ${AI_SESSION_BUDGET_CREDITS:-1}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-12}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_TOOL_CHARS: ${AI_MAX_TOOL_CHARS:-14000}
      AI_MAX_TURN_TOOL_CHARS: ${AI_MAX_TURN_TOOL_CHARS:-240000}
      AI_REDACT_SECRETS: ${AI_REDACT_SECRETS:-1}
      AI_DAY_OFFSET_HOURS: ${AI_DAY_OFFSET_HOURS:-7}
      AI_MODELS_FILE: /config/ai_models.json
    secrets:
      - admin_password_hash
    volumes:
      - uploads:/data/uploads
      - work:/data/work
      - db:/data/db
      - ./config:/config:ro
    networks: [edge, backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    pids_limit: 256

  # ------------------------------------------------------------------ Worker antrean
  # Hanya di jaringan `backend` (internal, tanpa akses internet). Akses ke DeepSeek
  # ditambahkan di M3 lewat jaringan terpisah. Alat dekompilasi TIDAK ada di sini:
  # worker menitipkan job ke `runner` lewat volume `spool` (tanpa Docker socket).
  worker:
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      DATA_DIR: /data
      TIMEOUT_APKTOOL: ${TIMEOUT_APKTOOL:-300}
      TIMEOUT_JADX: ${TIMEOUT_JADX:-900}
      TIMEOUT_ANALYZE: ${TIMEOUT_ANALYZE:-300}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-2700}
    volumes:
      - uploads:/data/uploads:ro
      - work:/data/work
      - db:/data/db
      - spool:/data/spool
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
      # web membuat/menyiapkan isi volume (izin & skema DB) lebih dulu.
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    pids_limit: 256

  # ------------------------------------------------------------------ Redis (antrean)
  redis:
    image: redis:8.8-alpine
    <<: *hardening
    # Jalankan langsung sebagai user `redis`: dengan cap_drop ALL, entrypoint tidak bisa
    # chown/setuid bila dimulai sebagai root.
    user: redis
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?jalankan `make init`}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m

  # ------------------------------------------------------------------ Runner (jadx + apktool)
  # Satu-satunya tempat yang mem-parsing APK tak tepercaya. TANPA JARINGAN, tanpa Redis, tanpa DB, tanpa
  # Docker socket: hanya melihat APK (read-only), direktori kerja, dan spool job. Setelah tiap job, daemon
  # keluar dan Docker memulai container baru (RUNNER_RECYCLE) sehingga tiap job berjalan di lingkungan bersih.
  runner:
    build:
      context: ./services
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,size=256m,nosuid
    environment:
      DATA_DIR: /data
      RUNNER_RECYCLE: ${RUNNER_RECYCLE:-1}
      MAX_OUTPUT_MB: ${MAX_OUTPUT_MB:-3072}
    volumes:
      - uploads:/data/uploads:ro
      - work:/data/work
      - spool:/data/spool
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "runner-daemon", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 3g
    cpus: 2
    pids_limit: 512

networks:
  # Caddy <-> web. Berjaringan keluar (web akan memanggil DeepSeek untuk chat di M3).
  edge: {}
  # Web <-> worker <-> redis. `internal`: tidak ada rute ke internet.
  backend:
    internal: true

volumes:
  uploads:   # APK asli (<sha256>.apk); web rw, worker & runner ro
  work:      # hasil per analisis (jadx/, apktool/, logs/, manifest.json)
  db:        # SQLite (WAL); hanya web & worker — runner TIDAK punya akses
  spool:     # antrean berkas worker -> runner; hanya worker & runner
  redisdata:
  caddy_data:
  caddy_config:

secrets:
  admin_password_hash:
    file: ./secrets/admin_password_hash
