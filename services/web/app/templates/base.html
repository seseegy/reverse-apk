<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% block title %}reverse-apk{% endblock %}</title>
  <link rel="preload" href="/static/fonts/IBMPlexSans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  {% block header %}{% endblock %}
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
